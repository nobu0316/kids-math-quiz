<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計算クイズ</title>

  <!-- 見た目の設定は style.css にまとめています -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- アプリ全体を囲む箱です -->
  <main class="app">
    <h1>計算クイズ</h1>

    <!-- 最初に難易度と計算の種類を選ぶ画面です -->
    <section id="start-screen" class="screen">
      <p class="lead">難易度と計算の種類をえらんで、10問にチャレンジしよう！</p>

      <!-- 難易度を選ぶボタンです。最初は「かんたん」が選ばれています -->
      <h2 class="choice-title">難易度</h2>
      <div class="difficulty-buttons">
        <button class="difficulty-button selected" data-difficulty="easy">かんたん</button>
        <button class="difficulty-button" data-difficulty="normal">ふつう</button>
        <button class="difficulty-button" data-difficulty="hard">むずかしい</button>
      </div>

      <h2 class="choice-title">計算の種類</h2>
      <div class="operation-buttons">
        <button class="operation-button" data-operation="add">足し算</button>
        <button class="operation-button" data-operation="subtract">引き算</button>
        <button class="operation-button" data-operation="multiply">掛け算</button>
      </div>
    </section>

    <!-- クイズ中に表示する画面です。最初は hidden クラスで隠しています -->
    <section id="quiz-screen" class="screen hidden">
      <p id="question-count" class="question-count">1 / 10 問目</p>
      <div id="question" class="question">1 + 1 = ?</div>

      <!-- type="number" にすると数字を入力しやすくなります -->
      <input id="answer-input" class="answer-input" type="number" inputmode="numeric" placeholder="答え">

      <button id="answer-button" class="main-button">答える</button>
      <p id="result-message" class="result-message"></p>
    </section>

    <!-- 最後の結果を表示する画面です -->
    <section id="finish-screen" class="screen hidden">
      <!-- 通常結果と復習結果で、JavaScriptが見出しを切り替えます -->
      <h2 id="finish-title">結果発表</h2>

      <!-- 正解した数を表示します -->
      <p id="correct-result" class="result-info">10問中 0問正解</p>

      <!-- クイズにかかった時間を表示します -->
      <p id="time-result" class="result-info">かかった時間: 0秒</p>

      <div class="mistake-area">
        <h3 id="mistake-title">間違えた問題</h3>
        <ul id="mistake-list" class="mistake-list"></ul>
      </div>

      <!-- 間違えた問題があるときだけ、JavaScriptでこのボタンを表示します -->
      <button id="review-button" class="main-button hidden">間違えた問題を復習する</button>

      <button id="restart-button" class="main-button">もう一度やる</button>
    </section>
  </main>

  <!-- クイズの動きは script.js にまとめています -->
  <script src="script.js"></script>
</body>
</html>
